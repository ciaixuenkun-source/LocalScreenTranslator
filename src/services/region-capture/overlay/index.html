<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>区域截图</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <img id="screenImage" class="screen-image" alt="" draggable="false" />
    <div id="initialShade" class="initial-shade"></div>
    <div id="selection" class="selection" hidden>
      <span id="sizeLabel" class="size-label"></span>
    </div>
    <div id="controls" class="controls" hidden>
      <button id="confirmButton" class="confirm" type="button" title="确认">✓</button>
      <button id="cancelButton" type="button" title="取消">×</button>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
